<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword, 
    signInWithPopup, 
    GoogleAuthProvider 
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBr0powiXiHXuGYNa-5s3zGvBAi23SgXvM",
    authDomain: "dreamyfpsr.firebaseapp.com",
    projectId: "dreamyfpsr",
    storageBucket: "dreamyfpsr.firebasestorage.app",
    messagingSenderId: "963672326962",
    appId: "1:963672326962:web:e92c5dbf4876cae84d8d2b",
    measurementId: "G-KE8KD21TWB"
  };

  // Initialize Firebase & Auth
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();

  let isSignUp = false;

  const authForm = document.getElementById('authForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const submitBtn = document.getElementById('submitBtn');
  const googleBtn = document.getElementById('googleBtn');
  const authError = document.getElementById('authError');
  const formTitle = document.getElementById('formTitle');
  const formSubtitle = document.getElementById('formSubtitle');
  const switchText = document.getElementById('switchText');
  const toggleModeBtn = document.getElementById('toggleModeBtn');

  // Toggle between Login & Register modes
  toggleModeBtn.addEventListener('click', () => {
    isSignUp = !isSignUp;
    authError.innerText = '';
    if (isSignUp) {
      formTitle.innerHTML = "Create <span>Account</span>";
      formSubtitle.innerText = "Sign up to get started";
      submitBtn.innerText = "Sign Up";
      switchText.innerText = "Already have an account?";
      toggleModeBtn.innerText = "Log in";
    } else {
      formTitle.innerHTML = "Welcome <span>Back</span>";
      formSubtitle.innerText = "Log in to access your profile and dashboard";
      submitBtn.innerText = "Log In";
      switchText.innerText = "Don't have an account?";
      toggleModeBtn.innerText = "Sign up";
    }
  });

  // Handle Email/Password Submit
  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authError.innerText = '';
    const email = emailInput.value;
    const password = passwordInput.value;

    try {
      if (isSignUp) {
        await createUserWithEmailAndPassword(auth, email, password);
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
      window.location.href = "index.html";
    } catch (error) {
      authError.innerText = error.message.replace("Firebase: ", "");
    }
  });

  // Handle Google Sign-In Popup
  googleBtn.addEventListener('click', async () => {
    authError.innerText = '';
    try {
      await signInWithPopup(auth, googleProvider);
      window.location.href = "index.html";
    } catch (error) {
      authError.innerText = error.message.replace("Firebase: ", "");
    }
  });
</script>
