<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - DreamyFPS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    
    html, body {
      background: #0f0f0f;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Navigation Bar */
    nav { padding: 1.5rem; background: #1f1f1f; display: flex; justify-content: center; gap: 20px; }
    nav a { color: #fff; text-decoration: none; font-weight: bold; }
    nav a:hover { color: #ff0000; }

    /* Main Container */
    .container {
      max-width: 800px;
      margin: 3rem auto;
      padding: 2rem;
      background: #181818;
      border: 1px solid #2e2e2e;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #ff0000; }
    .username { color: #888; margin-bottom: 2rem; font-weight: bold; }

    /* 3D Perspective Scene Container */
    .avatar-scene {
      width: 280px;
      height: 280px;
      margin: 0 auto 2rem auto;
      perspective: 1000px;
      cursor: pointer;
    }

    /* Interactive 3D Card */
    .avatar-tilt-card {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #2a2a2a 0%, #0f0f0f 100%);
      border: 1px solid #333;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.2);
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, box-shadow 0.3s ease;
      overflow: hidden;
    }

    .avatar-scene:hover .avatar-tilt-card {
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.5);
    }

    .avatar-tilt-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: translateZ(40px);
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
    }

    p { color: #ccc; margin-bottom: 1rem; font-size: 1.1rem; line-height: 1.6; }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="videos.html">Videos</a>
  </nav>

  <!-- About Section -->
  <div class="container">
    <h1>About DreamyFPS</h1>
    <p class="username">@amliteralynotcheats</p>

    <!-- Interactive 3D Tilt Avatar -->
    <div class="avatar-scene" id="avatar-scene">
      <div class="avatar-tilt-card" id="tilt-card">
        <!-- Direct official Roblox avatar endpoint using your ID -->
        <img src="https://tr.rbxcdn.com/30DAY-Avatar-11078012460-Png/420/420/Avatar/Png/noFilter" 
             alt="DreamyFPS Roblox Avatar" 
             draggable="false"
             onerror="this.src='https://www.roblox.com/headshot-thumbnail/image?userId=11078012460&width=420&height=420&format=png'">
      </div>
    </div>

    <p>Welcome to the official home of DreamyFPS!</p>
    <p>I post Roblox gameplay, FPS clips, and Shorts. Check out the home page to see live subscriber counters and my newest video uploads!</p>
  </div>

  <script>
    // Mouse movement 3D tilt calculations
    const scene = document.getElementById('avatar-scene');
    const card = document.getElementById('tilt-card');

    scene.addEventListener('mousemove', (e) => {
      const sceneRect = scene.getBoundingClientRect();
      const x = e.clientX - sceneRect.left;
      const y = e.clientY - sceneRect.top;

      const sceneCenterX = sceneRect.width / 2;
      const sceneCenterY = sceneRect.height / 2;

      const maxTilt = 22;
      const tiltX = (sceneCenterY - y) / sceneCenterY * maxTilt;
      const tiltY = (x - sceneCenterX) / sceneCenterX * maxTilt;

      card.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
    });

    scene.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });
  </script>

</body>
</html>
