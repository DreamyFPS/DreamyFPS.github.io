<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - DreamyFPS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f0f0f; color: #fff; text-align: center; min-height: 100vh; }
    
    /* Navigation Bar */
    nav { padding: 1.5rem; background: #1f1f1f; display: flex; justify-content: center; gap: 20px; }
    nav a { color: #fff; text-decoration: none; font-weight: bold; }
    nav a:hover { color: #ff0000; }

    /* Main Container */
    .container {
      max-width: 800px;
      margin: 3rem auto;
      padding: 2rem;
      background: #181818;
      border: 1px solid #2e2e2e;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #ff0000; }
    .username { color: #888; margin-bottom: 2rem; font-weight: bold; }

    /* Roblox Avatar Card */
    .avatar-card {
      width: 280px;
      height: 280px;
      margin: 0 auto 2rem auto;
      background: radial-gradient(circle, #2a2a2a 0%, #0f0f0f 100%);
      border: 1px solid #333;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .avatar-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 0 35px rgba(255, 0, 0, 0.4);
    }

    .avatar-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    p { color: #ccc; margin-bottom: 1rem; font-size: 1.1rem; line-height: 1.6; }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="videos.html">Videos</a>
  </nav>

  <!-- About Section -->
  <div class="container">
    <h1>About DreamyFPS</h1>
    <p class="username">@amliteralynotcheats</p>

    <!-- Roblox Avatar Display -->
    <div class="avatar-card">
      <img id="roblox-avatar" src="" alt="DreamyFPS Roblox Avatar">
    </div>

    <p>Welcome to the official home of DreamyFPS!</p>
    <p>I post Roblox gameplay, FPS clips, and Shorts. Check out the home page to see live subscriber counters and my newest video uploads!</p>
  </div>

  <!-- Dynamic Roblox Avatar Fetcher -->
  <script>
    const USERNAME = 'amliteralynotcheats';

    async function loadAvatar() {
      try {
        const userRes = await fetch('https://users.roblox.com/v1/usernames/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usernames: [USERNAME], excludeBannedUsers: false })
        });
        const userData = await userRes.json();

        if (userData.data && userData.data.length > 0) {
          const userId = userData.data[0].id;

          const avatarRes = await fetch(`https://thumbnails.roblox.com/v1/users/avatar?userIds=${userId}&size=420x420&format=Png&isCircular=false`);
          const avatarData = await avatarRes.json();

          if (avatarData.data && avatarData.data.length > 0) {
            document.getElementById('roblox-avatar').src = avatarData.data[0].imageUrl;
          }
        }
      } catch (err) {
        console.error("Could not load Roblox avatar:", err);
      }
    }

    loadAvatar();
  </script>

</body>
</html>
