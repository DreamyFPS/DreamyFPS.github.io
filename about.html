<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - DreamyFPS</title>
  <!-- FontAwesome for Social Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Rise Client Color Palette & Reset */
    :root {
      --bg-dark: #09090b;
      --card-bg: #121215;
      --border-color: #22222a;
      --accent-red: #ff2a4b;
      --accent-glow: rgba(255, 42, 75, 0.35);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      /* Subtle dark grid pattern like modern gaming sites */
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 42, 75, 0.12) 0%, transparent 60%),
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    /* Full-Screen Loading Overlay */
    #site-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050507;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader-box {
      width: 100%;
      max-width: 380px;
      padding: 2.5rem;
      background: rgba(12, 12, 16, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    }

    .avatar-ring {
      width: 75px;
      height: 75px;
      margin: 0 auto 1.5rem auto;
      border-radius: 50%;
      background: rgba(255, 42, 75, 0.1);
      border: 2px solid rgba(255, 42, 75, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .avatar-ring i {
      font-size: 1.8rem;
      color: var(--accent-red);
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }

    .avatar-ring::after {
      content: '';
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      border: 2px dashed rgba(255, 42, 75, 0.4);
      border-radius: 50%;
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .brand-name span { color: var(--accent-red); }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      height: 1.2rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff1e42, #ff526c);
      border-radius: 99px;
      box-shadow: 0 0 12px var(--accent-glow);
      transition: width 0.1s ease-out;
    }

    .percentage-indicator {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Rise-Style Glass Navigation Bar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 4rem;
      background: rgba(18, 18, 21, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-main);
      text-decoration: none;
      text-transform: uppercase;
    }

    .nav-logo span { color: var(--accent-red); }

    .nav-socials {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .social-icon-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 1.4rem;
      transition: color 0.2s ease, text-shadow 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-icon-btn:hover {
      color: var(--accent-red);
      text-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    .nav-links { display: flex; gap: 2rem; list-style: none; }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--text-main);
    }

    /* Main Container Layout */
    .hero-container {
      max-width: 1000px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
    }

    /* Rise-Style Glow Card */
    .avatar-card-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .avatar-card {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      position: relative;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .avatar-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-red);
      box-shadow: 0 0 30px var(--accent-glow);
    }

    .avatar-card img {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.7));
    }

    /* Typography & Buttons */
    .about-content h1 {
      font-size: 3rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 0.8rem;
    }

    .about-content h1 span {
      background: linear-gradient(135deg, #ffffff 0%, #ff2a4b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .username-badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      background: rgba(255, 42, 75, 0.1);
      border: 1px solid rgba(255, 42, 75, 0.3);
      color: var(--accent-red);
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .about-content p {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    /* Action Buttons */
    .btn-group { display: flex; gap: 1rem; }

    .btn {
      padding: 0.8rem 1.8rem;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: var(--accent-red);
      color: #fff;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .btn-primary:hover {
      background: #e01e3e;
      box-shadow: 0 0 30px rgba(255, 42, 75, 0.6);
    }

    .btn-secondary {
      background: #1c1c24;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: #252530;
      border-color: #333342;
    }

    /* Responsive Design for Mobile */
    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; flex-direction: column; gap: 1rem; }
      .nav-left { flex-direction: column; gap: 0.8rem; }
      .hero-container { grid-template-columns: 1fr; text-align: center; margin: 2rem auto; }
      .about-content h1 { font-size: 2.2rem; }
      .btn-group { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Full-Screen Loading Screen Overlay -->
  <div id="site-loader">
    <div class="loader-box">
      <div class="avatar-ring">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <div class="brand-name">Dreamy<span>FPS</span></div>
      <div class="status-text" id="statusMessage">Loading about page...</div>
      <div class="progress-track">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <div class="percentage-indicator" id="percentageText">0%</div>
    </div>
  </div>

  <!-- Rise Style Navbar -->
  <nav>
    <div class="nav-left">
      <a href="index.html" class="nav-logo">Dreamy<span>FPS</span></a>
      <div class="nav-socials">
        <a href="https://discord.gg/XnfZ3fZpy8" target="_blank" class="social-icon-btn" title="Discord"><i class="fa-brands fa-discord"></i></a>
        <a href="https://tiktok.com/@yourlink" target="_blank" class="social-icon-btn" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
        <a href="https://youtube.com/@DreamyFPSRoblox" target="_blank" class="social-icon-btn" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
      </div>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html" class="active">About</a></li>
      <li><a href="contact.html">Contact Me</a></li>
    </ul>
  </nav>

  <!-- Hero Content Section -->
  <div class="hero-container">
    
    <!-- Avatar Card -->
    <div class="avatar-card-wrapper">
      <div class="avatar-card">
        <img src="avatar.webp" alt="DreamyFPS Roblox Avatar" draggable="false">
      </div>
    </div>

    <!-- Text & Bio -->
    <div class="about-content">
      <span class="username-badge">@amliteralynotcheats</span>
      <h1>Dominate The <span>Game.</span></h1>
      <p>
        Welcome to the official hub of DreamyFPS. High-level Roblox gameplay, FPS highlights, and short-form content uploaded regularly.
      </p>

      <div class="btn-group">
        <a href="index.html" class="btn btn-primary">Home</a>
        <a href="contact.html" class="btn btn-secondary">Contact Me</a>
      </div>
    </div>

  </div>

  <!-- Loading Animation Script -->
  <script>
    const steps = [
      "Establishing secure connection...",
      "Loading user interface...",
      "Fetching assets...",
      "Finalizing...",
      "Welcome."
    ];

    let progress = 0;
    const progressBarFill = document.getElementById('progressBarFill');
    const percentageText = document.getElementById('percentageText');
    const statusMessage = document.getElementById('statusMessage');
    const siteLoader = document.getElementById('site-loader');

    const loaderInterval = setInterval(() => {
      progress += Math.floor(Math.random() * 7) + 3;

      if (progress >= 100) {
        progress = 100;
        clearInterval(loaderInterval);
        statusMessage.innerText = steps[4];
        
        setTimeout(() => {
          siteLoader.style.opacity = '0';
          siteLoader.style.visibility = 'hidden';
        }, 300);
      }

      progressBarFill.style.width = progress + '%';
      percentageText.innerText = progress + '%';

      if (progress > 75) {
        statusMessage.innerText = steps[3];
      } else if (progress > 50) {
        statusMessage.innerText = steps[2];
      } else if (progress > 25) {
        statusMessage.innerText = steps[1];
      }
    }, 70);
  </script>

</body>
</html>
