<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gateway - DreamyFPS</title>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Rise Client Color Palette & Reset */
    :root {
      --bg-dark: #09090b;
      --card-bg: #121215;
      --border-color: #22222a;
      --accent-red: #ff2a4b;
      --accent-glow: rgba(255, 42, 75, 0.35);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 42, 75, 0.15) 0%, transparent 65%),
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    /* Full-Screen Loading Overlay */
    #site-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050507;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader-box {
      width: 100%;
      max-width: 380px;
      padding: 2.5rem;
      background: rgba(12, 12, 16, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    }

    .avatar-ring {
      width: 75px;
      height: 75px;
      margin: 0 auto 1.5rem auto;
      border-radius: 50%;
      background: rgba(255, 42, 75, 0.1);
      border: 2px solid rgba(255, 42, 75, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .avatar-ring i {
      font-size: 1.8rem;
      color: var(--accent-red);
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }

    .avatar-ring::after {
      content: '';
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      border: 2px dashed rgba(255, 42, 75, 0.4);
      border-radius: 50%;
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .brand-name span { color: var(--accent-red); }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      height: 1.2rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff1e42, #ff526c);
      border-radius: 99px;
      box-shadow: 0 0 12px var(--accent-glow);
      transition: width 0.1s ease-out;
    }

    .percentage-indicator {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Rise Glass Navigation Bar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 3rem;
      background: rgba(18, 18, 21, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-main);
      text-decoration: none;
      text-transform: uppercase;
    }

    .nav-logo span { color: var(--accent-red); }

    .nav-socials {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .social-icon-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 1.3rem;
      transition: color 0.2s ease, text-shadow 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-icon-btn:hover {
      color: var(--accent-red);
      text-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    .nav-links { 
      display: flex; 
      gap: 2rem; 
      list-style: none; 
      align-items: center; 
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--text-main);
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Gateway Container & Pill Buttons matching your image style */
    .gateway-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .gateway-title {
      font-size: 2.8rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    .gateway-title span {
      background: linear-gradient(135deg, #ffffff 0%, #ff2a4b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gateway-subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 3rem;
    }

    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      align-items: center;
    }

    /* Exact Pill Button Styling based on reference image */
    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 100%;
      max-width: 340px;
      padding: 1.1rem 2rem;
      background: linear-gradient(180deg, #17171d 0%, #0d0d10 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      color: var(--text-main);
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .pill-btn i {
      font-size: 1.25rem;
      color: var(--accent-red);
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .pill-btn:hover {
      background: linear-gradient(180deg, #202028 0%, #121216 100%);
      border-color: rgba(255, 42, 75, 0.4);
      box-shadow: 0 0 30px var(--accent-glow);
      transform: translateY(-2px);
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      nav { padding: 1rem 1.5rem; }
      .menu-toggle { display: block; }
      
      .nav-links {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: rgba(12, 12, 16, 0.95);
        backdrop-filter: blur(16px);
        flex-direction: column;
        align-items: center;
        padding: 2rem 0;
        gap: 1.5rem;
        border-bottom: 1px solid var(--border-color);
        transform: translateY(-150%);
        opacity: 0;
        visibility: hidden;
        transition: transform 0.3s ease, opacity 0.3s ease, visibility 0.3s ease;
        z-index: 99;
      }

      .nav-links.active {
        transform: translateY(0);
        opacity: 1;
        visibility: visible;
      }

      .gateway-title { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

  <!-- Full-Screen Loading Screen Overlay -->
  <div id="site-loader">
    <div class="loader-box">
      <div class="avatar-ring">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <div class="brand-name">Dreamy<span>FPS</span></div>
      <div class="status-text" id="statusMessage">Unlocking gateway...</div>
      <div class="progress-track">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <div class="percentage-indicator" id="percentageText">0%</div>
    </div>
  </div>

  <!-- Rise Style Responsive Navbar -->
  <nav>
    <div class="nav-left">
      <a href="index.html" class="nav-logo">Dreamy<span>FPS</span></a>
      <div class="nav-socials">
        <a href="https://discord.gg/XnfZ3fZpy8" target="_blank" class="social-icon-btn" title="Discord"><i class="fa-brands fa-discord"></i></a>
        <a href="https://tiktok.com/@yourlink" target="_blank" class="social-icon-btn" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
        <a href="https://youtube.com/@DreamyFPSRoblox" target="_blank" class="social-icon-btn" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
      </div>
    </div>

    <button class="menu-toggle" id="mobileMenuBtn" aria-label="Toggle navigation menu">
      <i class="fa-solid fa-bars"></i>
    </button>

    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact Me</a></li>
    </ul>
  </nav>

  <!-- Gateway Content Section -->
  <div class="gateway-hero">
    <div class="gateway-title">Secret <span>Gateway</span></div>
    <p class="gateway-subtitle">Select a destination below to proceed.</p>

    <div class="buttons-container">
      <!-- Script Hub Button -->
      <a href="hsfgbhsdghjdsfghjdscriptg.html" class="pill-btn">
        <i class="fa-solid fa-code"></i> Script Hub
      </a>

      <!-- Find Executors Button -->
      <a href="hiugrjkdfgjkndfgjnkdfgjn.html" class="pill-btn">
        <i class="fa-solid fa-terminal"></i> Find executors
      </a>
    </div>
  </div>

  <!-- Mobile Hamburger Menu Toggle Script -->
  <script>
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const navLinks = document.getElementById('navLinks');

    mobileMenuBtn.addEventListener('click', () => {
      navLinks.classList.toggle('active');
      const icon = mobileMenuBtn.querySelector('i');
      if (navLinks.classList.contains('active')) {
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-xmark');
      } else {
        icon.classList.remove('fa-xmark');
        icon.classList.add('fa-bars');
      }
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth > 900) {
        navLinks.classList.remove('active');
        mobileMenuBtn.querySelector('i').className = 'fa-solid fa-bars';
      }
    });
  </script>

  <!-- Loading Animation Script -->
  <script>
    const steps = [
      "Verifying clearance...",
      "Bypassing security layers...",
      "Loading gateway modules...",
      "Almost there...",
      "Access Granted."
    ];

    let progress = 0;
    const progressBarFill = document.getElementById('progressBarFill');
    const percentageText = document.getElementById('percentageText');
    const statusMessage = document.getElementById('statusMessage');
    const siteLoader = document.getElementById('site-loader');

    const loaderInterval = setInterval(() => {
      progress += Math.floor(Math.random() * 7) + 3;

      if (progress >= 100) {
        progress = 100;
        clearInterval(loaderInterval);
        statusMessage.innerText = steps[4];
        
        setTimeout(() => {
          siteLoader.style.opacity = '0';
          siteLoader.style.visibility = 'hidden';
        }, 300);
      }

      progressBarFill.style.width = progress + '%';
      percentageText.innerText = progress + '%';

      if (progress > 75) {
        statusMessage.innerText = steps[3];
      } else if (progress > 50) {
        statusMessage.innerText = steps[2];
      } else if (progress > 25) {
        statusMessage.innerText = steps[1];
      }
    }, 70);
  </script>

</body>
</html>
