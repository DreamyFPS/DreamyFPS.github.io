<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My YouTube Channel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f0f0f; color: #fff; text-align: center; }
    
    /* Top Navigation Bar */
    nav { padding: 1.5rem; background: #1f1f1f; display: flex; justify-content: center; gap: 20px; }
    nav a { color: #fff; text-decoration: none; font-weight: bold; }
    nav a:hover { color: #ff0000; }

    /* Header Banner */
    header { padding: 4rem 1rem 2rem 1rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    p { color: #aaa; margin-bottom: 1.5rem; }

    /* Subscribe Button */
    .btn { display: inline-block; padding: 12px 24px; background: #ff0000; color: #fff; border-radius: 20px; text-decoration: none; font-weight: bold; }
    .btn:hover { background: #cc0000; }

    /* Video Container */
    .content-area { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 12px; margin-top: 1rem; }
  </style>
</head>
<body>

  <!-- Navigation Bar links to your other future pages -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="videos.html">Videos</a>
  </nav>

  <!-- Channel Intro Header -->
  <header>
    <h1>Welcome to [Your Channel Name]</h1>
    <p>We post awesome videos every week. Hit the button below to join the community!</p>
    <a class="btn" href="https://youtube.com" target="_blank">Subscribe on YouTube</a>
  </header>

  <!-- Video Section -->
  <div class="content-area">
    <h2>Featured Video</h2>
    <!-- Swap the src URL below with your own YouTube video link -->
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
  </div>

</body>
</html>
