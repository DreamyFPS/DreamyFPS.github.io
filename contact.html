<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Ticket - DreamyFPS</title>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Rise Client Color Palette & Reset */
    :root {
      --bg-dark: #09090b;
      --card-bg: #121215;
      --border-color: #22222a;
      --accent-red: #ff2a4b;
      --accent-glow: rgba(255, 42, 75, 0.35);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 42, 75, 0.12) 0%, transparent 60%),
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    /* Full-Screen Loading Overlay */
    #site-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050507;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader-box {
      width: 100%;
      max-width: 380px;
      padding: 2.5rem;
      background: rgba(12, 12, 16, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    }

    .avatar-ring {
      width: 75px;
      height: 75px;
      margin: 0 auto 1.5rem auto;
      border-radius: 50%;
      background: rgba(255, 42, 75, 0.1);
      border: 2px solid rgba(255, 42, 75, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .avatar-ring i {
      font-size: 1.8rem;
      color: var(--accent-red);
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }

    .avatar-ring::after {
      content: '';
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      border: 2px dashed rgba(255, 42, 75, 0.4);
      border-radius: 50%;
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .brand-name span { color: var(--accent-red); }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      height: 1.2rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff1e42, #ff526c);
      border-radius: 99px;
      box-shadow: 0 0 12px var(--accent-glow);
      transition: width 0.1s ease-out;
    }

    .percentage-indicator {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Rise-Style Glass Navigation Bar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 4rem;
      background: rgba(18, 18, 21, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-main);
      text-decoration: none;
      text-transform: uppercase;
    }

    .nav-logo span { color: var(--accent-red); }

    .nav-socials {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .social-icon-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 1.4rem;
      transition: color 0.2s ease, text-shadow 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-icon-btn:hover {
      color: var(--accent-red);
      text-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    .nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--text-main);
    }

    .nav-login-btn {
      background: rgba(255, 42, 75, 0.1);
      border: 1px solid rgba(255, 42, 75, 0.3);
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      color: var(--accent-red) !important;
      transition: all 0.2s ease !important;
    }

    .nav-login-btn:hover {
      background: var(--accent-red) !important;
      color: #fff !important;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* Ticket Form Layout */
    .ticket-container {
      max-width: 600px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    .ticket-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    .ticket-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .ticket-header h1 {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
    }

    .ticket-header h1 span { color: var(--accent-red); }

    .ticket-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .form-control {
      width: 100%;
      padding: 0.9rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--accent-red);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 130px;
    }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: var(--accent-red);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 20px var(--accent-glow);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-submit:hover {
      background: #e01e3e;
      box-shadow: 0 0 30px rgba(255, 42, 75, 0.6);
    }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; flex-direction: column; gap: 1rem; }
      .nav-left { flex-direction: column; gap: 0.8rem; }
      .ticket-card { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- Full-Screen Loading Screen Overlay -->
  <div id="site-loader">
    <div class="loader-box">
      <div class="avatar-ring">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <div class="brand-name">Dreamy<span>FPS</span></div>
      <div class="status-text" id="statusMessage">Loading contact page...</div>
      <div class="progress-track">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <div class="percentage-indicator" id="percentageText">0%</div>
    </div>
  </div>

  <!-- Rise Style Navbar -->
  <nav>
    <div class="nav-left">
      <a href="index.html" class="nav-logo">Dreamy<span>FPS</span></a>
      <div class="nav-socials">
        <a href="https://discord.gg/XnfZ3fZpy8" target="_blank" class="social-icon-btn" title="Discord"><i class="fa-brands fa-discord"></i></a>
        <a href="https://tiktok.com/@yourlink" target="_blank" class="social-icon-btn" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
        <a href="https://youtube.com/@DreamyFPSRoblox" target="_blank" class="social-icon-btn" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
      </div>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="active">Contact Me</a></li>
      <li><a href="login.html" id="authNavLink" class="nav-login-btn">Login / Sign Up</a></li>
    </ul>
  </nav>

  <!-- Ticket Form Section -->
  <div class="ticket-container">
    <div class="ticket-card">
      <div class="ticket-header">
        <h1>Open a <span>Support Ticket</span></h1>
        <p>Send a message directly and we'll reply to your email or Discord.</p>
      </div>

      <!-- 
        IMPORTANT: Replace the action URL below with your own free Formspree link!
      -->
      <form action="https://formspree.io/f/YOUR_FORM_ID_HERE" method="POST">
        <div class="form-group">
          <label for="name">Your Name / Gamertag</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="e.g. DreamyFan" required>
        </div>

        <div class="form-group">
          <label for="email">Email or Discord Tag (for reply)</label>
          <input type="text" id="email" name="_replyto" class="form-control" placeholder="name@example.com or user#0000" required>
        </div>

        <div class="form-group">
          <label for="message">Message / Ticket Details</label>
          <textarea id="message" name="message" class="form-control" placeholder="Type your message here..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit Ticket</button>
      </form>
    </div>
  </div>

  <!-- Firebase Auth State Check Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBr0powiXiHXuGYNa-5s3zGvBAi23SgXvM",
      authDomain: "dreamyfpsr.firebaseapp.com",
      projectId: "dreamyfpsr",
      storageBucket: "dreamyfpsr.firebasestorage.app",
      messagingSenderId: "963672326962",
      appId: "1:963672326962:web:e92c5dbf4876cae84d8d2b",
      measurementId: "G-KE8KD21TWB"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const authNavLink = document.getElementById('authNavLink');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authNavLink.innerText = "My Account";
        authNavLink.href = "#";
        authNavLink.onclick = async (e) => {
          e.preventDefault();
          if (confirm(`Logged in as: ${user.email}\nDo you want to log out?`)) {
            await signOut(auth);
            window.location.reload();
          }
        };
      } else {
        authNavLink.innerText = "Login / Sign Up";
        authNavLink.href = "login.html";
        authNavLink.onclick = null;
      }
    });
  </script>

  <!-- Loading Animation Script -->
  <script>
    const steps = [
      "Establishing secure connection...",
      "Loading ticketing interface...",
      "Fetching assets...",
      "Finalizing...",
      "Welcome."
    ];

    let progress = 0;
    const progressBarFill = document.getElementById('progressBarFill');
    const percentageText = document.getElementById('percentageText');
    const statusMessage = document.getElementById('statusMessage');
    const siteLoader = document.getElementById('site-loader');

    const loaderInterval = setInterval(() => {
      progress += Math.floor(Math.random() * 7) + 3;

      if (progress >= 100) {
        progress = 100;
        clearInterval(loaderInterval);
        statusMessage.innerText = steps[4];
        
        setTimeout(() => {
          siteLoader.style.opacity = '0';
          siteLoader.style.visibility = 'hidden';
        }, 300);
      }

      progressBarFill.style.width = progress + '%';
      percentageText.innerText = progress + '%';

      if (progress > 75) {
        statusMessage.innerText = steps[3];
      } else if (progress > 50) {
        statusMessage.innerText = steps[2];
      } else if (progress > 25) {
        statusMessage.innerText = steps[1];
      }
    }, 70);
  </script>

</body>
</html>
