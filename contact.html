<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me - DreamyFPS</title>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Rise Client Color Palette & Reset (Pink/Red Theme) */
    :root {
      --bg-dark: #09090b;
      --card-bg: #121215;
      --border-color: #22222a;
      --accent-red: #ff2a4b;
      --accent-glow: rgba(255, 42, 75, 0.35);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 42, 75, 0.15) 0%, transparent 65%),
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    /* Full-Screen Loading Overlay */
    #site-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050507;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader-box {
      width: 100%;
      max-width: 380px;
      padding: 2.5rem;
      background: rgba(12, 12, 16, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    }

    .avatar-ring {
      width: 75px;
      height: 75px;
      margin: 0 auto 1.5rem auto;
      border-radius: 50%;
      background: rgba(255, 42, 75, 0.1);
      border: 2px solid rgba(255, 42, 75, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .avatar-ring i {
      font-size: 1.8rem;
      color: var(--accent-red);
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }

    .avatar-ring::after {
      content: '';
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      border: 2px dashed rgba(255, 42, 75, 0.4);
      border-radius: 50%;
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .brand-name span { color: var(--accent-red); }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      height: 1.2rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff1e42, #ff526c);
      border-radius: 99px;
      box-shadow: 0 0 12px var(--accent-glow);
      transition: width 0.1s ease-out;
    }

    .percentage-indicator {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Rise Glass Navigation Bar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 3rem;
      background: rgba(18, 18, 21, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-main);
      text-decoration: none;
      text-transform: uppercase;
    }

    .nav-logo span { color: var(--accent-red); }

    .nav-socials {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .social-icon-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 1.3rem;
      transition: color 0.2s ease, text-shadow 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-icon-btn:hover {
      color: var(--accent-red);
      text-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    .nav-links { 
      display: flex; 
      gap: 2rem; 
      list-style: none; 
      align-items: center; 
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--text-main);
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Main Container & Layout */
    .container {
      max-width: 800px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .page-title {
      font-size: 2.8rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
    }

    .page-title span {
      background: linear-gradient(135deg, #ffffff 0%, #ff2a4b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* Contact Card Style */
    .contact-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 0.9rem 1rem;
      background: #09090b;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent-red);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .form-select option {
      background: #121215;
      color: var(--text-main);
    }

    .form-textarea {
      resize: vertical;
      min-height: 130px;
    }

    .submit-btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--accent-red);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 20px var(--accent-glow);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .submit-btn:hover {
      background: #e01e3e;
      transform: translateY(-2px);
    }

    .success-msg {
      color: var(--accent-red);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 1rem;
      font-weight: 600;
      min-height: 1.2rem;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      nav { padding: 1rem 1.5rem; }
      .menu-toggle { display: block; }
      
      .nav-links {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: rgba(12, 12, 16, 0.95);
        backdrop-filter: blur(16px);
        flex-direction: column;
        align-items: center;
        padding: 2rem 0;
        gap: 1.5rem;
        border-bottom: 1px solid var(--border-color);
        transform: translateY(-150%);
        opacity: 0;
        visibility: hidden;
        transition: transform 0.3s ease, opacity 0.3s ease, visibility 0.3s ease;
        z-index: 99;
      }

      .nav-links.active {
        transform: translateY(0);
        opacity: 1;
        visibility: visible;
      }

      .page-title { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

  <!-- Full-Screen Loading Screen Overlay -->
  <div id="site-loader">
    <div class="loader-box">
      <div class="avatar-ring">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <div class="brand-name">Dreamy<span>FPS</span></div>
      <div class="status-text" id="statusMessage">Loading contact page...</div>
      <div class="progress-track">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <div class="percentage-indicator" id="percentageText">0%</div>
    </div>
  </div>

  <!-- Rise Style Responsive Navbar -->
  <nav>
    <div class="nav-left">
      <a href="hiugrjkdfgjkndfgjnkdfgjn.html" class="nav-logo">Dreamy<span>FPS</span></a>
      <div class="nav-socials">
        <a href="https://discord.gg/XnfZ3fZpy8" target="_blank" class="social-icon-btn" title="Discord"><i class="fa-brands fa-discord"></i></a>
        <a href="https://tiktok.com/@yourlink" target="_blank" class="social-icon-btn" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
        <a href="https://youtube.com/@DreamyFPSRoblox" target="_blank" class="social-icon-btn" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
      </div>
    </div>

    <button class="menu-toggle" id="mobileMenuBtn" aria-label="Toggle navigation menu">
      <i class="fa-solid fa-bars"></i>
    </button>

    <ul class="nav-links" id="navLinks">
      <li><a href="hiugrjkdfgjkndfgjnkdfgjn.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="active">Contact Me</a></li>
    </ul>
  </nav>

  <!-- Main Container -->
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Contact <span>Me</span></h1>
      <p class="page-subtitle">Have questions, Found an issue?, or want to collab Reach out below.</p>
    </div>

    <!-- Contact Form Card -->
    <div class="contact-card">
      <form id="contactForm" onsubmit="handleFormspreeSubmit(event)">
        <div class="form-group">
          <label for="senderName"><i class="fa-solid fa-user" style="color: var(--accent-red);"></i> Your Roblox Username</label>
          <input type="text" name="roblox_username" id="senderName" class="form-input" placeholder="Enter your Roblox username..." required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="senderYT"><i class="fa-brands fa-youtube" style="color: var(--accent-red);"></i> Your YT Channel Link</label>
          <input type="url" name="yt_channel" id="senderYT" class="form-input" placeholder="https://youtube.com/@yourchannel" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="inquiryType"><i class="fa-solid fa-tag" style="color: var(--accent-red);"></i> Reason / Topic</label>
          <select name="reason" id="inquiryType" class="form-select">
            <option value="Collab with me">Collab with me</option>
            <option value="Report a issue with the website">Report a issue with the website</option>
            <option value="Have a question?">Have a question?</option>
          </select>
        </div>

        <div class="form-group">
          <label for="senderMessage"><i class="fa-solid fa-message" style="color: var(--accent-red);"></i> Message</label>
          <textarea name="message" id="senderMessage" class="form-textarea" placeholder="Type your message here..." required></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Send Message</button>
        <div class="success-msg" id="successMsg"></div>
      </form>
    </div>
  </div>

  <!-- Interactive Scripts & Formspree AJAX Handler -->
  <script>
    // Mobile Menu Toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const navLinks = document.getElementById('navLinks');
    if (mobileMenuBtn && navLinks) {
      mobileMenuBtn.addEventListener('click', () => {
        navLinks.classList.toggle('active');
      });
    }

    // Formspree Async Submission Handler
    async function handleFormspreeSubmit(event) {
      event.preventDefault();
      
      const form = event.target;
      const successMsg = document.getElementById('successMsg');
      const submitBtn = document.getElementById('submitBtn');
      
      // REPLACE WITH YOUR ACTUAL FORMSPREE ENDPOINT URL
      const FORMSPREE_ENDPOINT = "YOUR_FORMSPREE_ENDPOINT_URL";

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";
      successMsg.textContent = "";

      try {
        const formData = new FormData(form);
        const response = await fetch(FORMSPREE_ENDPOINT, {
          method: 'POST',
          body: formData,
          headers: {
            'Accept': 'application/json'
          }
        });

        if (response.ok) {
          successMsg.style.color = "var(--accent-red)";
          successMsg.textContent = "Thanks! Your message has been sent successfully.";
          form.reset();
        } else {
          const data = await response.json();
          if (data && data.errors) {
            successMsg.style.color = "#ff4d4d";
            successMsg.textContent = data.errors.map(error => error.message).join(", ");
          } else {
            successMsg.style.color = "#ff4d4d";
            successMsg.textContent = "Oops! There was a problem submitting your form.";
          }
        }
      } catch (error) {
        successMsg.style.color = "#ff4d4d";
        successMsg.textContent = "Network error! Please check your connection.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send Message";
      }
    }
  </script>

  <!-- Loading Animation Script -->
  <script>
    let currentPercent = 0;
    const progressBarFill = document.getElementById('progressBarFill');
    const percentageText = document.getElementById('percentageText');
    const siteLoader = document.getElementById('site-loader');
    const statusMessages = [
      "Loading contact page...",
      "Configuring form elements...",
      "Ready."
    ];
    const statusMessage = document.getElementById('statusMessage');

    const loaderInterval = setInterval(() => {
      currentPercent += Math.floor(Math.random() * 20) + 10;
      if (currentPercent >= 100) {
        currentPercent = 100;
        clearInterval(loaderInterval);
        setTimeout(() => {
          siteLoader.style.opacity = '0';
          siteLoader.style.visibility = 'hidden';
        }, 300);
      }
      if (progressBarFill) progressBarFill.style.width = currentPercent + '%';
      if (percentageText) percentageText.textContent = currentPercent + '%';
      
      if (currentPercent > 60 && statusMessage) {
        statusMessage.textContent = statusMessages[2];
      } else if (currentPercent > 30 && statusMessage) {
        statusMessage.textContent = statusMessages[1];
      }
    }, 80);
  </script>

</body>
</html>
