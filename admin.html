<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - DreamyFPS</title>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Rise Client Color Palette & Reset */
    :root {
      --bg-dark: #09090b;
      --card-bg: #121215;
      --border-color: #22222a;
      --accent-red: #ff2a4b;
      --accent-glow: rgba(255, 42, 75, 0.35);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 42, 75, 0.12) 0%, transparent 60%),
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    /* Full-Screen Loading Overlay */
    #site-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050507;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader-box {
      width: 100%;
      max-width: 380px;
      padding: 2.5rem;
      background: rgba(12, 12, 16, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    }

    .avatar-ring {
      width: 75px;
      height: 75px;
      margin: 0 auto 1.5rem auto;
      border-radius: 50%;
      background: rgba(255, 42, 75, 0.1);
      border: 2px solid rgba(255, 42, 75, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .avatar-ring i {
      font-size: 1.8rem;
      color: var(--accent-red);
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }

    .avatar-ring::after {
      content: '';
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      border: 2px dashed rgba(255, 42, 75, 0.4);
      border-radius: 50%;
      animation: spin 8s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .brand-name { font-size: 1.3rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 0.3rem; }
    .brand-name span { color: var(--accent-red); }
    .status-text { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2rem; height: 1.2rem; }

    .progress-track {
      width: 100%; height: 8px; background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 99px;
      overflow: hidden; margin-bottom: 1rem;
    }

    .progress-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #ff1e42, #ff526c);
      border-radius: 99px; box-shadow: 0 0 12px var(--accent-glow); transition: width 0.1s ease-out;
    }

    .percentage-indicator { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); letter-spacing: 1px; }

    /* Glass Navigation Bar */
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.2rem 4rem; background: rgba(18, 18, 21, 0.8);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color);
      position: sticky; top: 0; z-index: 100;
    }

    .nav-left { display: flex; align-items: center; gap: 1.5rem; }
    .nav-logo { font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; color: var(--text-main); text-decoration: none; text-transform: uppercase; }
    .nav-logo span { color: var(--accent-red); }
    .nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: color 0.2s ease; }
    .nav-links a:hover, .nav-links a.active { color: var(--text-main); }

    /* Admin Layout */
    .admin-container {
      max-width: 1000px; margin: 3rem auto; padding: 0 1.5rem;
    }

    .admin-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 2rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem; border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .admin-header h1 { font-size: 1.8rem; font-weight: 900; }
    .admin-header h1 span { color: var(--accent-red); }

    .user-table {
      width: 100%; border-collapse: collapse; text-align: left; margin-top: 1rem;
    }

    .user-table th, .user-table td {
      padding: 1rem; border-bottom: 1px solid var(--border-color);
    }

    .user-table th {
      color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase;
      letter-spacing: 1px; font-weight: 700;
    }

    .user-table tr:hover {
      background: rgba(255, 42, 75, 0.03);
    }

    .access-denied {
      text-align: center; padding: 4rem 1rem; display: none;
    }

    .access-denied i { font-size: 3rem; color: var(--accent-red); margin-bottom: 1rem; }
    .access-denied h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .access-denied p { color: var(--text-muted); }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; flex-direction: column; gap: 1rem; }
      .admin-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
      .user-table { font-size: 0.85rem; }
      .user-table th, .user-table td { padding: 0.6rem; }
    }
  </style>
</head>
<body>

  <!-- Full-Screen Loading Overlay -->
  <div id="site-loader">
    <div class="loader-box">
      <div class="avatar-ring">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <div class="brand-name">Dreamy<span>FPS</span></div>
      <div class="status-text" id="statusMessage">Verifying permissions...</div>
      <div class="progress-track">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <div class="percentage-indicator" id="percentageText">0%</div>
    </div>
  </div>

  <!-- Navbar -->
  <nav>
    <div class="nav-left">
      <a href="index.html" class="nav-logo">Dreamy<span>FPS</span></a>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact Me</a></li>
      <li><a href="admin.html" class="active">Admin Panel</a></li>
    </ul>
  </nav>

  <!-- Admin Panel Container -->
  <div class="admin-container">
    
    <!-- Admin Content View -->
    <div class="admin-card" id="adminContent" style="display: none;">
      <div class="admin-header">
        <h1>Admin <span>Dashboard</span></h1>
        <div id="userCount" style="color: var(--text-muted); font-weight: 600;">Total Users: 0</div>
      </div>

      <table class="user-table">
        <thead>
          <tr>
            <th>User Email</th>
            <th>Firebase UID</th>
            <th>Last Login Time</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <!-- Populated by JavaScript -->
        </tbody>
      </table>
    </div>

    <!-- Access Denied View -->
    <div class="access-denied" id="accessDenied">
      <i class="fa-solid fa-lock"></i>
      <h2>Access Denied</h2>
      <p>You must be logged in as win11guy@gmail.com to view this page.</p>
    </div>

  </div>

  <!-- Firebase Auth & Admin Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      getDocs, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    // Admin Email Configured
    const ADMIN_EMAIL = "win11guy@gmail.com";

    const firebaseConfig = {
      apiKey: "AIzaSyBr0powiXiHXuGYNa-5s3zGvBAi23SgXvM",
      authDomain: "dreamyfpsr.firebaseapp.com",
      projectId: "dreamyfpsr",
      storageBucket: "dreamyfpsr.firebasestorage.app",
      messagingSenderId: "963672326962",
      appId: "1:963672326962:web:e92c5dbf4876cae84d8d2b",
      measurementId: "G-KE8KD21TWB"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const adminContent = document.getElementById('adminContent');
    const accessDenied = document.getElementById('accessDenied');
    const userTableBody = document.getElementById('userTableBody');
    const userCount = document.getElementById('userCount');

    // Verify logged in user matches win11guy@gmail.com
    onAuthStateChanged(auth, async (user) => {
      if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        accessDenied.style.display = 'none';
        adminContent.style.display = 'block';
        await loadUserRecords();
      } else {
        adminContent.style.display = 'none';
        accessDenied.style.display = 'block';
      }
    });

    // Fetch user records from Firestore
    async function loadUserRecords() {
      try {
        const usersRef = collection(db, "users");
        const q = query(usersRef, orderBy("lastLogin", "desc"));
        const querySnapshot = await getDocs(q);

        userTableBody.innerHTML = '';
        userCount.innerText = `Total Users logged: ${querySnapshot.size}`;

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const tr = document.createElement('tr');
          
          let formattedTime = "N/A";
          if (data.lastLogin && data.lastLogin.toDate) {
            formattedTime = data.lastLogin.toDate().toLocaleString();
          }

          tr.innerHTML = `
            <td><strong>${data.email || 'N/A'}</strong></td>
            <td style="font-family: monospace; color: var(--text-muted);">${data.uid || 'N/A'}</td>
            <td>${formattedTime}</td>
          `;
          userTableBody.appendChild(tr);
        });
      } catch (err) {
        console.error("Error fetching user records:", err);
      }
    }
  </script>

  <!-- Loader Script -->
  <script>
    let progress = 0;
    const progressBarFill = document.getElementById('progressBarFill');
    const percentageText = document.getElementById('percentageText');
    const siteLoader = document.getElementById('site-loader');

    const loaderInterval = setInterval(() => {
      progress += Math.floor(Math.random() * 8) + 4;

      if (progress >= 100) {
        progress = 100;
        clearInterval(loaderInterval);
        setTimeout(() => {
          siteLoader.style.opacity = '0';
          siteLoader.style.visibility = 'hidden';
        }, 300);
      }

      progressBarFill.style.width = progress + '%';
      percentageText.innerText = progress + '%';
    }, 60);
  </script>

</body>
</html>
